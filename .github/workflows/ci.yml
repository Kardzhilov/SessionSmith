name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  portable:
    name: Portable checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --no-default-features --all-targets --locked

  local-whisper:
    name: Local Whisper build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test default feature set
        run: cargo test --all-targets --locked