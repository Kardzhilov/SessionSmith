[package]
name = "sessionsmith"
version = "1.2.0"
edition = "2021"
description = "World-class TTRPG session notes CLI: audio → transcript → GM notes"
license = "MIT"
repository = "https://github.com/local/sessionsmith"

[[bin]]
name = "sessionsmith"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
inquire = "0.7"
indicatif = { version = "0.17", features = ["tokio"] }
comfy-table = "7"
owo-colors = { version = "4", features = ["supports-colors"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
dirs = "5"
walkdir = "2"
humantime = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
whisper-rs = { version = "0.14", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3"
once_cell = "1"
pulldown-cmark = "0.13"
unicode-width = "0.2"
crossterm = { version = "=0.28.1", features = ["bracketed-paste"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.18"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[features]
default = ["local-whisper"]
# In-process transcription via whisper-rs (bundles & builds whisper.cpp).
# Build requirements: a C/C++ toolchain, cmake, and clang/libclang.
local-whisper = ["dep:whisper-rs", "whisper-rs/tracing_backend"]
# GPU backends for local-whisper, selected at build time. Each needs the
# matching SDK/driver installed (CUDA toolkit, Vulkan SDK, or Apple Metal).
cuda = ["whisper-rs?/cuda"]
vulkan = ["whisper-rs?/vulkan"]
metal = ["whisper-rs?/metal"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
